org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true

# Mumble server QRV-Hub is built for. To build for your own server, change these
# three lines (the certificate is the server's TLS certificate in PEM format).
qrvhub.host=e2hub.vra.or.th
qrvhub.port=64738
qrvhub.serverCert=qrvhub/server/server.pem

org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true

# Mumble server QRV-Hub is built for. To build for your own server, change these
# three lines (the certificate is the server's TLS certificate in PEM format).
qrvhub.host=e2hub.vra.or.th
qrvhub.port=64738
qrvhub.serverCert=qrvhub/server/server.pem

# Extra audio feed mixed in while a channel is heard (joined or monitored): the
# WSS feed of the HS1AB station. Its address is not published: put qrvhub.feedUrl
# and qrvhub.feedOrigin in private.properties (not in git). Without them the app
# is built without the feed.
qrvhub.feedUrl=
qrvhub.feedOrigin=
qrvhub.feedChannel=HS1AB
